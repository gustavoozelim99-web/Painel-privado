<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Sem esta linha o celular finge ser um monitor de 980px e encolhe tudo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<title>Painel do Brain</title>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface-2:#FAFAF8; --surface-3:#EFEFEA;
  --line:#E5E5DF; --line-strong:#D3D3CB;
  --ink:#191A17; --ink-2:#4C4E47; --ink-3:#7C7E75;

  --area-pessoal:#3E9E76; --area-academico:#5B8DEF;
  --area-vendas:#C97A2E;  --area-loja:#A97BD6;

  --st-bom:#0F7C74; --st-atencao:#A87611; --st-risco:#BC3F2B;
  --st-bom-bg:#E4F2F0; --st-atencao-bg:#F6EDD8; --st-risco-bg:#F8E6E2;

  --ramp-0:#EAEAE4; --ramp-1:#CFD3CB; --ramp-2:#A6ADA1; --ramp-3:#6E766B; --ramp-4:#3A403A;

  --sh-1:0 1px 2px rgba(25,26,23,.05);
  --sh-2:0 1px 2px rgba(25,26,23,.05), 0 10px 28px -14px rgba(25,26,23,.22);
  --sh-3:0 24px 60px -20px rgba(25,26,23,.35);

  --r-card:14px; --r-control:8px; --r-mark:3px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:248px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121310; --surface:#1A1B18; --surface-2:#212320; --surface-3:#282A26;
    --line:#2C2E29; --line-strong:#3C3E37;
    --ink:#EDEDE7; --ink-2:#B6B8AF; --ink-3:#8B8D84;
    --area-pessoal:#54BC8E; --area-academico:#7FA8F6; --area-vendas:#E29C52; --area-loja:#C29CE6;
    --st-bom:#38AFA4; --st-atencao:#D6A63F; --st-risco:#E27059;
    --st-bom-bg:#16302E; --st-atencao-bg:#332B15; --st-risco-bg:#37211C;
    --ramp-0:#232520; --ramp-1:#374039; --ramp-2:#4F5C4F; --ramp-3:#7C8C7C; --ramp-4:#B8C6B6;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
    --sh-3:0 24px 60px -20px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121310; --surface:#1A1B18; --surface-2:#212320; --surface-3:#282A26;
  --line:#2C2E29; --line-strong:#3C3E37;
  --ink:#EDEDE7; --ink-2:#B6B8AF; --ink-3:#8B8D84;
  --area-pessoal:#54BC8E; --area-academico:#7FA8F6; --area-vendas:#E29C52; --area-loja:#C29CE6;
  --st-bom:#38AFA4; --st-atencao:#D6A63F; --st-risco:#E27059;
  --st-bom-bg:#16302E; --st-atencao-bg:#332B15; --st-risco-bg:#37211C;
  --ramp-0:#232520; --ramp-1:#374039; --ramp-2:#4F5C4F; --ramp-3:#7C8C7C; --ramp-4:#B8C6B6;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
  --sh-3:0 24px 60px -20px rgba(0,0,0,.85);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-wrap:break-word;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:620}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-mark)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--surface);border:1px solid var(--line-strong);padding:8px 12px;border-radius:var(--r-control);z-index:90}
.skip:focus{left:8px}

.eyebrow{font:600 11px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)} .small{font-size:13px}

/* ============================================================
   CASCA
   ============================================================ */
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:640;letter-spacing:-.01em}
.sync{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font:600 11px/1.5 var(--mono);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:999px;background:var(--ink-3);flex:none}
.sync[data-s="salvo"]{color:var(--st-bom);border-color:color-mix(in srgb,var(--st-bom) 28%,transparent);background:var(--st-bom-bg)}
.sync[data-s="salvo"] i{background:var(--st-bom)}
.sync[data-s="salvando"]{color:var(--st-atencao);border-color:color-mix(in srgb,var(--st-atencao) 28%,transparent);background:var(--st-atencao-bg)}
.sync[data-s="salvando"] i{background:var(--st-atencao);animation:pisca 1s ease-in-out infinite}
@keyframes pisca{50%{opacity:.25}}
@media (max-width:520px){.oculta-estreito{display:none}.sync b{display:none}.sync{padding:5px}}
.brand-dot{width:10px;height:10px;border-radius:var(--r-mark);background:var(--ink);flex:none}
.spacer{flex:1}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:var(--sp-4) var(--sp-3) var(--sp-7);display:flex;flex-direction:column;gap:var(--sp-5)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:0 var(--sp-3) var(--sp-2)}
.nav a{display:flex;align-items:center;gap:var(--sp-3);padding:8px var(--sp-3);border-radius:var(--r-control);color:var(--ink-2);font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav-chip{width:8px;height:8px;border-radius:var(--r-mark);flex:none;background:var(--line-strong)}
.main{padding:var(--sp-5) var(--sp-4) var(--sp-8);max-width:1220px;margin:0 auto;width:100%}
@media (max-width:1023px){
  .nav{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:50;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;box-shadow:var(--sh-2)}
  .nav[data-open="true"]{transform:translateX(0)}
  .scrim{position:fixed;inset:0;z-index:45;background:rgba(20,21,18,.45);opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim[data-open="true"]{opacity:1;pointer-events:auto}
}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
  .nav{position:sticky;top:0;height:100vh;overflow-y:auto;grid-row:1 / span 2}
  .topbar{grid-column:2} .main{grid-column:2;padding:var(--sp-6) var(--sp-6) var(--sp-8)}
  .nav-close,.nav-open,.scrim{display:none}
}

/* ============================================================
   GRADE
   ============================================================ */
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.stack-tight{display:flex;flex-direction:column;gap:var(--sp-2)}
.cols{display:grid;gap:var(--sp-4);grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1120px){
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cols-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
}
@media (min-width:720px) and (max-width:1119px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* trio de números que continua lado a lado no celular — empilhar três
   métricas curtas gasta tela à toa */
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.tri .kpi-v,.tri>div>.kpi-v{font-size:clamp(16px,4.4vw,23px)}
.tri .eyebrow{font-size:10px;letter-spacing:.08em}
@media (max-width:420px){.tri{gap:var(--sp-2)}.tri .delta,.tri .small{font-size:11px;line-height:1.35}}
.row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.scroll-x{overflow-x:auto}

/* ============================================================
   CARD (shadcn)
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-1);display:flex;flex-direction:column}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5) 0}
.card-h .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-c{padding:var(--sp-4) var(--sp-5) var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.card-c.flush{padding-top:var(--sp-3)}
.card-f{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.card h2{font-size:15px;font-weight:620} .card h3{font-size:14px;font-weight:600}
a.card{transition:box-shadow .18s,border-color .18s,transform .18s}
a.card:hover{box-shadow:var(--sh-2);border-color:var(--line-strong);transform:translateY(-1px)}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.page-head h1{font-size:clamp(22px,4.4vw,28px);letter-spacing:-.02em}
.page-head .t{display:flex;flex-direction:column;gap:4px}
.back{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:var(--sp-3)}
.back:hover{color:var(--ink)}

/* ============================================================
   BOTÕES / BADGE / TABS / TOGGLES
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:var(--r-control);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s,background .15s}
.btn:hover{opacity:.88}
.btn-outline{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-outline:hover{background:var(--surface-2);opacity:1}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);opacity:1}
.btn-danger{background:transparent;border-color:color-mix(in srgb,var(--st-risco) 40%,transparent);color:var(--st-risco)}
.btn-danger:hover{background:var(--st-risco-bg);opacity:1}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-icon{width:32px;height:32px;padding:0;flex:none}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font:600 12px/1.5 var(--mono);border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;flex:none;background:currentColor}
.badge-bom{color:var(--st-bom);background:var(--st-bom-bg);border-color:color-mix(in srgb,var(--st-bom) 26%,transparent)}
.badge-bom::before{border-radius:999px}
.badge-atencao{color:var(--st-atencao);background:var(--st-atencao-bg);border-color:color-mix(in srgb,var(--st-atencao) 26%,transparent)}
.badge-atencao::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.badge-risco{color:var(--st-risco);background:var(--st-risco-bg);border-color:color-mix(in srgb,var(--st-risco) 30%,transparent)}
.badge-risco::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.badge-neutro{color:var(--ink-2);background:var(--surface-2);border-color:var(--line)}
.badge-neutro::before{border-radius:var(--r-mark);background:var(--ink-3)}

.area-tag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.5 var(--mono);color:var(--ink-2)}
.area-dot{width:9px;height:9px;border-radius:var(--r-mark);flex:none}
.a-pessoal{background:var(--area-pessoal)} .a-academico{background:var(--area-academico)}
.a-vendas{background:var(--area-vendas)} .a-loja{background:var(--area-loja)}

.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--surface-3);border-radius:10px;max-width:100%;overflow-x:auto}
.tabs button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{padding:7px 12px;border:1px solid var(--line-strong);border-radius:var(--r-control);
  background:var(--surface);font-size:13px;font-weight:560;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.toggles button:hover{background:var(--surface-2)}
.toggles button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggles button[aria-pressed="true"] .area-dot{box-shadow:0 0 0 1.5px var(--bg)}

/* ============================================================
   MÉTRICA / PROGRESSO / LISTA
   ============================================================ */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi-v{font:600 clamp(24px,5.4vw,30px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi-v small{font-size:.46em;font-weight:600;color:var(--ink-3);letter-spacing:0}
.delta{font:600 12px/1.5 var(--mono)}
.up{color:var(--st-bom)} .down{color:var(--st-risco)}

.prog{height:6px;border-radius:999px;background:var(--ramp-0);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px;background:var(--ink);transition:width .5s ease}
.prog[data-area="pessoal"]>i{background:var(--area-pessoal)}
.prog[data-area="academico"]>i{background:var(--area-academico)}
.prog[data-area="vendas"]>i{background:var(--area-vendas)}
.prog[data-area="loja"]>i{background:var(--area-loja)}

.linha{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:11px 0;border-bottom:1px solid var(--line)}
.linha:last-child{border-bottom:0;padding-bottom:0}
.linha:first-child{padding-top:0}
.linha-n{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.linha-n>span:first-child{font-weight:560}
.linha-acts{display:flex;gap:4px;opacity:.55;transition:opacity .15s;flex:none}
.linha:hover .linha-acts,.linha:focus-within .linha-acts{opacity:1}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px/2.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.act{width:1%;white-space:nowrap;padding-left:var(--sp-3)}

.vazio{border:1px dashed var(--line-strong);border-radius:var(--r-control);padding:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-3);align-items:flex-start;color:var(--ink-2);background:var(--surface-2)}

/* ============================================================
   VALOR EDITÁVEL INLINE
   ============================================================ */
.edit{border-bottom:1px dashed var(--line-strong);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.edit:hover{border-color:var(--ink);color:var(--ink)}
.edit::after{content:"✎";font-size:.62em;opacity:.45}
.edit:hover::after{opacity:1}

/* ============================================================
   SHEET (shadcn)
   ============================================================ */
.sheet-scrim{position:fixed;inset:0;z-index:80;background:rgba(20,21,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.sheet-scrim[data-on="true"]{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:85;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh-3);display:flex;flex-direction:column;
  inset:auto 0 0 0;max-height:92vh;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet[data-on="true"]{transform:none}
@media (min-width:720px){
  .sheet{inset:0 0 0 auto;width:min(440px,100vw);max-height:none;border-radius:0;transform:translateX(102%)}
}
.sheet-h{padding:var(--sp-5) var(--sp-5) var(--sp-3);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);border-bottom:1px solid var(--line)}
.sheet-b{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4);overflow-y:auto;flex:1}
.sheet-f{padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--line);display:flex;gap:var(--sp-2);background:var(--surface-2)}
.grab{width:34px;height:4px;border-radius:999px;background:var(--line-strong);margin:8px auto 0}
@media (min-width:720px){.grab{display:none}}

.field{display:flex;flex-direction:column;gap:7px}
.field>label{font:600 12px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.input{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:var(--r-control);padding:9px 11px}
.input:focus{outline:2px solid var(--ink);outline-offset:-1px;background:var(--surface)}
textarea.input{resize:vertical;min-height:84px;font-family:inherit}
.input::placeholder{color:var(--ink-3)}
.err{font-size:12px;color:var(--st-risco)}
.field[data-err="true"] .input,.field[data-err="true"] .money{border-color:var(--st-risco)}

.money{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-control);padding:6px 12px}
.money span{font:600 14px var(--mono);color:var(--ink-3)}
.money input{flex:1;min-width:0;border:0;background:none;font:600 26px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;letter-spacing:-.02em}
.money input:focus{outline:none}
.money:focus-within{outline:2px solid var(--ink);outline-offset:-1px}

.stepper{display:flex;align-items:center;gap:var(--sp-2)}
.stepper button{width:38px;height:38px;flex:none;border:1px solid var(--line-strong);border-radius:var(--r-control);
  background:var(--surface);font-size:19px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper input{flex:1;min-width:0;text-align:center;font:600 20px var(--mono);font-variant-numeric:tabular-nums;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-control);color:var(--ink);padding:8px}
.hint{font-size:12px;color:var(--ink-3)}

.toast{position:fixed;z-index:95;left:50%;bottom:20px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:560;
  box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast[data-on="true"]{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   HÁBITOS / CHECK
   ============================================================ */
.check{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-control);
  border:1px solid var(--line);background:var(--surface-2)}
.check:has(input:checked){background:var(--surface-3);border-color:var(--line-strong)}
.check input{appearance:none;width:22px;height:22px;flex:none;margin:1px 0 0;border:1.5px solid var(--line-strong);
  border-radius:6px;background:var(--surface);cursor:pointer;transition:background .18s,border-color .18s}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";display:block;width:6px;height:11px;margin:2px auto 0;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(42deg)}
.check-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.check-n{font-weight:560}
.check input:checked+.check-b .check-n{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.check-m{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.tagm{font:600 12px/1.5 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.serve{font-size:12px;color:var(--ink-3);border-bottom:1px dotted var(--line-strong)}

.fim{border:1px dashed var(--line-strong);border-radius:var(--r-control);padding:var(--sp-3) var(--sp-4);background:var(--surface-2);color:var(--ink-2);font-size:14px}

.degraus{display:flex;gap:5px;flex:1}
.degrau{flex:1;height:9px;border-radius:var(--r-mark);background:var(--ramp-0);border:1px solid var(--line);transition:background .25s}
.degrau[data-on="true"]{background:var(--ink);border-color:var(--ink)}

/* ============================================================
   GARGALO
   ============================================================ */
.gargalo{border:1px solid color-mix(in srgb,var(--area-vendas) 32%,var(--line));border-radius:var(--r-card);
  background:linear-gradient(180deg,color-mix(in srgb,var(--area-vendas) 8%,var(--surface)),var(--surface));
  padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}

.fonte-v{font:640 clamp(26px,6vw,34px)/1 var(--mono);letter-spacing:-.03em}
.deps{display:flex;flex-direction:column;gap:var(--sp-3);position:relative;padding-left:26px}
.deps::before{content:"";position:absolute;left:11px;top:-14px;bottom:28px;width:2px;background:color-mix(in srgb,var(--area-vendas) 48%,transparent)}

.dep-pessoal{border-left-color:var(--area-pessoal)} .dep-loja{border-left-color:var(--area-loja)}
@media (min-width:720px){

/* ============================================================
   AGENDA DO DIA — a-fazeres por horário
   ============================================================ */
.cb{appearance:none;width:22px;height:22px;flex:none;border:1.5px solid var(--line-strong);border-radius:6px;
  background:var(--surface);cursor:pointer;transition:background .18s,border-color .18s}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::after{content:"";display:block;width:6px;height:11px;margin:2px auto 0;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(42deg)}

.agenda{display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:50px 22px minmax(0,1fr) auto;align-items:center;gap:var(--sp-3);
  padding:11px 0;border-bottom:1px solid var(--line)}
.ag:last-child{border-bottom:0}

.agora{display:flex;align-items:center;gap:var(--sp-2);padding:8px 0 8px 50px}
.agora i{width:8px;height:8px;border-radius:999px;background:var(--st-risco);flex:none}

   O QUE ESTÁ TRAVANDO
   ============================================================ */

.heat button[data-n="3"]{background:var(--ramp-3)} .heat button[data-n="4"]{background:var(--ramp-4)}

.timeline{position:relative;padding-left:var(--sp-5)}

.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:999px;background:var(--surface);border:2px solid var(--line-strong)}

.tl[data-t="feito"]::before{background:var(--ink);border-color:var(--ink)}
.tl-apertada{border-left:3px solid var(--st-atencao);background:var(--st-atencao-bg);padding:var(--sp-3) var(--sp-4);
  border-radius:0 var(--r-control) var(--r-control) 0;margin:0 0 var(--sp-4) calc(-1 * var(--sp-5))}

.cartao{border-radius:12px;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);
  color:#F7F7F4;min-height:132px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.cartao::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.cartao .n{font:600 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.cartao .v{font:600 21px/1 var(--mono);letter-spacing:-.02em}
.cartao .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.24);overflow:hidden}
.cartao .bar>i{display:block;height:100%;background:#fff;border-radius:999px}

.capa{height:96px;border-radius:var(--r-control);display:flex;align-items:flex-end;padding:var(--sp-3);border:1px solid var(--line)}
.capa span{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--surface);padding:5px 8px;border-radius:var(--r-mark)}

#tip{position:fixed;z-index:96;pointer-events:none;opacity:0;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);padding:7px 10px;border-radius:var(--r-control);
  font:12px/1.45 var(--mono);white-space:nowrap;transition:opacity .12s;box-shadow:var(--sh-2)}
#tip[data-on="true"]{opacity:1}

.page[hidden]{display:none}
.page{animation:entra .26s ease both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>

<script>
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const brl=n=>"R$ "+Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const usd=n=>"US$ "+Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const kg=n=>Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" kg";
const soma=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const dataBR=iso=>{if(!iso)return "sem data";const[a,m,d]=iso.split("-");return `${d}/${m}`};

/* ============================================================
   STORE — interface pequena, persistência e notificação escondidas
   ============================================================ */
/* Copia de emergencia: so entra em cena se a API nao responder (sem
   servidor, ou sem internet). Fica VAZIA de proposito - dado inventado
   aqui viraria mentira na tela. Os arquivos em dados/ e que mandam. */
const SEED={
  cartoes:[], gastos:[], entradas:[], dividas:[],
  habitos:[], tarefas:[], notas:[],
  cargas:[], sessoes:[],
  entregas:[],
  funil:[], pedidos:[], receitaVanetto:[], vanettoSessoes:[],
  objetivos:[]
};

/* Mesma porta de sempre — all / add / update / remove / on.
   O que mudou foi o que tem ATRÁS dela: agora são os arquivos em dados/,
   não o navegador. Se a API não responder (link do artifact, sem servidor),
   cai sozinho pro modo local e continua funcionando — só não atravessa
   aparelho e o Claude não enxerga. */
const store=(()=>{
  const CHAVE="painel-brain-v3";

  const GRUPOS={
    financas:["cartoes","gastos","entradas","dividas"],
    dia:["habitos","tarefas","notas"],
    treino:["cargas","sessoes"],
    estudo:["entregas"],
    negocios:["funil","pedidos","receitaVanetto","vanettoSessoes"],
    metas:["objetivos"]
  };
  const GRUPO_DE={};
  for(const g in GRUPOS) GRUPOS[g].forEach(c=>{ GRUPO_DE[c]=g; });

  let db, versao=0, modo="local", pendentes=new Set(), timer=null, salvando=false;

  try{ const raw=localStorage.getItem(CHAVE); db=raw?JSON.parse(raw):structuredClone(SEED); }
  catch(e){ db=structuredClone(SEED); }
  for(const k in SEED) if(!db[k]) db[k]=structuredClone(SEED[k]);

  const ouvintes=[];
  const notificar=()=>ouvintes.forEach(f=>f());
  const guardarLocal=()=>{ try{ localStorage.setItem(CHAVE,JSON.stringify(db)); }catch(e){} };

  let sinal=()=>{};
  const situacao=()=>modo!=="arquivos" ? "local" : (pendentes.size||salvando) ? "salvando" : "salvo";

  /* muda na tela na hora; o arquivo é gravado logo atrás */
  function mexeu(colecao){
    guardarLocal();
    notificar();
    if(modo!=="arquivos") return;
    const g=GRUPO_DE[colecao];
    if(!g) return;
    pendentes.add(g);
    sinal(situacao());
    clearTimeout(timer);
    timer=setTimeout(sincronizar,700);
  }

  function corpoDoGrupo(g){
    const dados={};
    GRUPOS[g].forEach(c=>{ dados[c]=db[c]; });
    return {versao,dados};
  }

  /* aplica o que veio do servidor, menos os grupos que eu ainda não gravei */
  function adotar(servidor,exceto){
    versao=servidor.versao;
    for(const g in GRUPOS){
      if(exceto&&exceto.has(g)) continue;
      GRUPOS[g].forEach(c=>{ if(Array.isArray(servidor[c])) db[c]=servidor[c]; });
    }
  }

  async function sincronizar(){
    if(modo!=="arquivos"||salvando||!pendentes.size) return;
    salvando=true; sinal("salvando");
    const fila=Array.from(pendentes);
    pendentes.clear();
    try{
      for(const g of fila){
        let r=await fetch(`/api/dados/${g}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(corpoDoGrupo(g))});
        if(r.status===409){
          /* mexeram nos arquivos com a página aberta: pego o que mudou lá,
             mantenho o que acabei de fazer aqui, e reenvio uma vez */
          adotar(await r.json(),new Set([g]));
          r=await fetch(`/api/dados/${g}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(corpoDoGrupo(g))});
        }
        if(!r.ok) throw new Error(`${g}: ${r.status}`);
        versao=(await r.json()).versao;
      }
      guardarLocal();
      notificar();
    }catch(e){
      console.warn("não consegui gravar:",e.message);
      fila.forEach(g=>pendentes.add(g));
      clearTimeout(timer); timer=setTimeout(sincronizar,4000);
    }finally{
      salvando=false; sinal(situacao());
    }
  }

  /* pega mudança feita nos arquivos com a página já aberta */
  async function conferir(){
    if(modo!=="arquivos"||pendentes.size||salvando||document.hidden) return;
    try{
      const r=await fetch("/api/dados",{cache:"no-store"});
      if(!r.ok) return;
      const s=await r.json();
      if(s.versao===versao) return;
      adotar(s); guardarLocal(); notificar();
    }catch(e){}
  }

  return {
    all:k=>db[k],
    add(k,r){ r.id=uid(); db[k].unshift(r); mexeu(k); return r; },
    update(k,id,patch){ const r=db[k].find(x=>x.id===id); if(r) Object.assign(r,patch); mexeu(k); return r; },
    remove(k,id){ db[k]=db[k].filter(x=>x.id!==id); mexeu(k); },
    zerar(){ db=structuredClone(SEED); mexeu("gastos"); },
    on(f){ ouvintes.push(f); },
    aoMudarSituacao(f){ sinal=f; f(situacao()); },
    async iniciar(){
      try{
        const r=await fetch("/api/dados",{cache:"no-store"});
        if(!r.ok) throw new Error(r.status);
        adotar(await r.json());
        modo="arquivos";
        guardarLocal(); notificar();
        setInterval(conferir,20000);
        addEventListener("visibilitychange",conferir);
      }catch(e){
        modo="local";
      }
      sinal(situacao());
    }
  };
})();

/* ============================================================
   SHEET — um formulário construído a partir de uma spec de campos
   ============================================================ */
const sheet=(()=>{
  const el=$("#sheet"), scrim=$("#sheetScrim"), body=$("#sheetBody");
  let cfg=null, ultimoFoco=null;

  const CAMPO={
    text:(f,v)=>`<input class="input" data-f="${f.k}" type="text" value="${esc(v??"")}" placeholder="${esc(f.ph||"")}">`,
    area:(f,v)=>`<textarea class="input" data-f="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v??"")}</textarea>`,
    money:(f,v)=>`<div class="money"><span>R$</span><input data-f="${f.k}" type="text" inputmode="decimal" value="${v??""}" placeholder="0"></div>`,
    numero:(f,v)=>`<input class="input num" data-f="${f.k}" type="text" inputmode="numeric" value="${v??""}" placeholder="${esc(f.ph||"0")}">`,
    data:(f,v)=>`<input class="input" data-f="${f.k}" type="date" value="${esc(v??"")}">`,
    stepper:(f,v)=>`<div class="stepper" data-step-wrap>
        <button type="button" data-step="-1" aria-label="Diminuir">−</button>
        <input data-f="${f.k}" type="text" inputmode="decimal" value="${v??0}" data-inc="${f.inc||1}">
        <button type="button" data-step="1" aria-label="Aumentar">+</button>
      </div>${f.unidade?`<span class="hint">em ${esc(f.unidade)}, de ${f.inc} em ${f.inc}</span>`:""}`,
    chips:(f,v)=>`<div class="toggles" data-f="${f.k}" role="group">${
        f.opts.map(o=>`<button type="button" data-v="${esc(o.v)}" aria-pressed="${String(o.v)===String(v)}">${o.dot?`<i class="area-dot ${o.dot}"></i>`:""}${esc(o.t)}</button>`).join("")
      }</div>`
  };

  function abrir(c){
    cfg=c; ultimoFoco=document.activeElement;
    $("#sheetTitulo").textContent=c.titulo;
    $("#sheetSub").textContent=c.sub||"";
    $("#sheetOk").textContent=c.okTxt||"Salvar";
    body.innerHTML=c.campos.map(f=>`
      <div class="field" data-campo="${f.k}">
        <label for="">${esc(f.label)}</label>
        ${CAMPO[f.tipo](f,(c.valores||{})[f.k])}
        ${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}
        <span class="err" hidden></span>
      </div>`).join("")
      + (c.onExcluir?`<button class="btn btn-danger btn-block" id="sheetDel" type="button">Excluir</button>`:"");

    $$("[data-step-wrap] button",body).forEach(b=>b.addEventListener("click",()=>{
      const inp=$("input",b.parentElement);
      const inc=parseFloat(inp.dataset.inc)*parseInt(b.dataset.step,10);
      const atual=parseFloat(String(inp.value).replace(",","."))||0;
      inp.value=Math.max(0,Math.round((atual+inc)*100)/100).toString().replace(".",",");
    }));
    $$(".toggles",body).forEach(g=>g.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b)return;
      $$("button",g).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    }));
    const del=$("#sheetDel",body);
    if(del) del.addEventListener("click",()=>{ c.onExcluir(); fechar(); toast("Excluído."); });

    el.setAttribute("data-on","true"); scrim.setAttribute("data-on","true");
    setTimeout(()=>{ const p=$(".sheet-b input,.sheet-b textarea",el); if(p&&window.innerWidth>=720) p.focus(); },240);
  }

  function ler(){
    const v={};
    cfg.campos.forEach(f=>{
      if(f.tipo==="chips"){
        const on=$(`.toggles[data-f="${f.k}"] button[aria-pressed="true"]`,body);
        v[f.k]=on?on.dataset.v:"";
      }else{
        const inp=$(`[data-f="${f.k}"]`,body);
        let raw=inp.value.trim();
        if(f.tipo==="money"||f.tipo==="stepper"||f.tipo==="numero"){
          raw=raw.replace(/\./g,"").replace(",",".");
          v[f.k]=raw===""?"":parseFloat(raw);
          if(Number.isNaN(v[f.k])) v[f.k]="";
        }else v[f.k]=raw;
      }
    });
    return v;
  }

  function validar(v){
    let ok=true;
    cfg.campos.forEach(f=>{
      const campo=$(`[data-campo="${f.k}"]`,body), err=$(".err",campo);
      const vazio=v[f.k]===""||v[f.k]==null;
      if(f.req&&vazio){
        campo.setAttribute("data-err","true");
        err.textContent=f.erro||"Preencha este campo para salvar.";
        err.hidden=false; ok=false;
      }else{ campo.removeAttribute("data-err"); err.hidden=true; }
    });
    return ok;
  }

  function confirmar(){
    const v=ler();
    if(!validar(v)) return;
    cfg.onSalvar(v);
    fechar();
    toast(cfg.toast||"Salvo.");
  }
  function fechar(){
    el.removeAttribute("data-on"); scrim.removeAttribute("data-on");
    if(ultimoFoco&&ultimoFoco.focus) setTimeout(()=>ultimoFoco.focus(),60);
  }

  $("#sheetOk").addEventListener("click",confirmar);
  $("#sheetCancel").addEventListener("click",fechar);
  $("#sheetX").addEventListener("click",fechar);
  scrim.addEventListener("click",fechar);
  addEventListener("keydown",e=>{
    if(e.key==="Escape"&&el.getAttribute("data-on")==="true") fechar();
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&el.getAttribute("data-on")==="true") confirmar();
  });
  return {abrir};
})();

let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.setAttribute("data-on","true");
  clearTimeout(toastT); toastT=setTimeout(()=>t.removeAttribute("data-on"),2400);
}

/* ============================================================
   GRÁFICOS — SVG no vocabulário do shadcn/Recharts
   ============================================================ */
const CORES={pessoal:"var(--area-pessoal)",academico:"var(--area-academico)",vendas:"var(--area-vendas)",loja:"var(--area-loja)"};
const PALETA=["var(--ramp-4)","var(--ramp-3)","var(--ramp-2)","var(--area-vendas)","var(--area-loja)","var(--area-academico)","var(--area-pessoal)"];

function barraTopo(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function fmtEixo(v,f){ return f?f(v):String(v); }

/* área com gradiente */
function gArea(o){
  const W=620,H=o.h||210,L=46,R=12,T=14,B=28;
  const max=o.max||Math.max(...o.series.flatMap(s=>s.dados))*1.12||1;
  const px=i=>L+(W-L-R)*(i/Math.max(1,o.labels.length-1));
  const py=v=>H-B-(H-B-T)*(v/max);
  const gid="grad"+uid();
  const grid=[0,.25,.5,.75,1].map(f=>{
    const v=max*f;
    return `<line class="g-line" x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}"/>
      <text class="g-axis" x="${L-8}" y="${py(v)+3.5}" text-anchor="end">${fmtEixo(Math.round(v),o.fmtY)}</text>`;
  }).join("");
  const eixoX=o.labels.map((l,i)=>`<text class="g-axis" x="${px(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join("");
  const corpo=o.series.map((s,si)=>{
    const d=s.dados.map((v,i)=>`${i?"L":"M"}${px(i)},${py(v)}`).join(" ");
    const fill=si===0&&!o.semFill
      ? `<path d="${d} L${px(s.dados.length-1)},${H-B} L${px(0)},${H-B} Z" fill="url(#${gid})"/>` : "";
    const dots=s.dados.map((v,i)=>`<circle class="g-dot" cx="${px(i)}" cy="${py(v)}" r="${si?3.2:4.2}"
       style="stroke:${s.cor}" tabindex="0" role="img"
       data-tip="${esc(o.labels[i])} · ${esc(s.nome)}: ${esc(o.fmtT?o.fmtT(v):v)}"
       aria-label="${esc(o.labels[i])} ${esc(s.nome)} ${esc(o.fmtT?o.fmtT(v):v)}"/>`).join("");
    return fill+`<path class="g-serie" d="${d}" style="stroke:${s.cor}${s.tracejada?";stroke-dasharray:5 4":""}"/>`+dots;
  }).join("");
  const metaLinha=o.meta!=null?`<line x1="${L}" y1="${py(o.meta)}" x2="${W-R}" y2="${py(o.meta)}"
      style="stroke:var(--st-bom);stroke-width:1.5;stroke-dasharray:3 4"/>
    <text class="g-axis" x="${W-R}" y="${py(o.meta)-6}" text-anchor="end" style="fill:var(--st-bom)">${esc(o.metaTxt||"meta")}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt||"gráfico")}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${o.series[0].cor}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${o.series[0].cor}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${metaLinha}${corpo}${eixoX}</svg>`;
}

/* barras (simples ou empilhadas) */
function gBarras(o){
  const W=620,H=o.h||200,L=46,R=12,T=14,B=28;
  const totais=o.labels.map((_,i)=>soma(o.series.map(s=>s.dados[i]||0)));
  const max=o.max||Math.max(...(o.empilhado?totais:o.series.flatMap(s=>s.dados)))*1.15||1;
  const passo=(W-L-R)/o.labels.length;
  const bw=Math.min(38,passo*(o.empilhado?.56:.7/o.series.length));
  const py=v=>H-B-(H-B-T)*(v/max);
  const grid=[0,.5,1].map(f=>{const v=max*f;
    return `<line class="g-line" x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}"/>
      <text class="g-axis" x="${L-8}" y="${py(v)+3.5}" text-anchor="end">${fmtEixo(Math.round(v),o.fmtY)}</text>`}).join("");
  let barras="";
  o.labels.forEach((l,i)=>{
    const cx=L+passo*i+passo/2;
    if(o.empilhado){
      let acc=0;
      o.series.forEach(s=>{
        const v=s.dados[i]||0, y0=py(acc), y1=py(acc+v);
        if(v>0) barras+=`<path class="g-bar" d="${barraTopo(cx-bw/2,y1,bw,y0-y1,3)}" fill="${s.cor}" tabindex="0" role="img"
          data-tip="${esc(l)} · ${esc(s.nome)}: ${esc(o.fmtT?o.fmtT(v):v)}" aria-label="${esc(l)} ${esc(s.nome)} ${esc(o.fmtT?o.fmtT(v):v)}"/>`;
        acc+=v;
      });
    }else{
      o.series.forEach((s,si)=>{
        const v=s.dados[i]||0;
        const x=cx-(bw*o.series.length)/2+si*bw;
        barras+=`<path class="g-bar" d="${barraTopo(x+1,py(v),bw-2,py(0)-py(v),3)}" fill="${s.cor}" tabindex="0" role="img"
          data-tip="${esc(l)} · ${esc(s.nome)}: ${esc(o.fmtT?o.fmtT(v):v)}" aria-label="${esc(l)} ${esc(s.nome)} ${esc(o.fmtT?o.fmtT(v):v)}"/>`;
      });
    }
    barras+=`<text class="g-axis" x="${cx}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;
  });
  const metaLinha=o.meta!=null?`<line x1="${L}" y1="${py(o.meta)}" x2="${W-R}" y2="${py(o.meta)}"
      style="stroke:var(--st-bom);stroke-width:1.5;stroke-dasharray:3 4"/>
    <text class="g-axis" x="${W-R}" y="${py(o.meta)-6}" text-anchor="end" style="fill:var(--st-bom)">${esc(o.metaTxt||"meta")}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt||"gráfico de barras")}">${grid}${metaLinha}${barras}</svg>`;
}

/* donut */
function gDonut(o){
  const S=200,c=S/2,rO=88,rI=58;
  const total=soma(o.dados,d=>d.v)||1;
  let ang=-Math.PI/2, segs="";
  o.dados.forEach((d,i)=>{
    const frac=d.v/total, a1=ang+frac*Math.PI*2-.018;
    const pt=(r,a)=>`${(c+r*Math.cos(a)).toFixed(2)},${(c+r*Math.sin(a)).toFixed(2)}`;
    const grande=(a1-ang)>Math.PI?1:0;
    segs+=`<path class="g-seg" d="M${pt(rO,ang)} A${rO},${rO} 0 ${grande} 1 ${pt(rO,a1)} L${pt(rI,a1)} A${rI},${rI} 0 ${grande} 0 ${pt(rI,ang)} Z"
      fill="${d.cor||PALETA[i%PALETA.length]}" tabindex="0" role="img"
      data-tip="${esc(d.t)}: ${esc(o.fmtT?o.fmtT(d.v):d.v)} · ${Math.round(frac*100)}%"
      aria-label="${esc(d.t)} ${Math.round(frac*100)} por cento"/>`;
    ang+=frac*Math.PI*2;
  });
  return `<svg class="chart" viewBox="0 0 ${S} ${S}" style="max-width:210px;margin:0 auto" role="img" aria-label="${esc(o.alt||"distribuição")}">
    ${segs}
    <text x="${c}" y="${c-4}" text-anchor="middle" style="fill:var(--ink);font:600 21px var(--mono);letter-spacing:-.02em">${esc(o.centro||"")}</text>
    <text x="${c}" y="${c+15}" text-anchor="middle" style="fill:var(--ink-3);font:600 10px var(--mono);letter-spacing:.1em">${esc(o.centroSub||"")}</text>
  </svg>`;
}

/* radial de progresso */
function gRadial(o){
  const S=170,c=S/2,r=68,circ=2*Math.PI*r;
  const frac=Math.max(0,Math.min(1,o.v/o.max));
  return `<svg class="chart" viewBox="0 0 ${S} ${S}" style="max-width:180px;margin:0 auto" role="img" aria-label="${esc(o.alt||"progresso")}">
    <circle class="g-track" cx="${c}" cy="${c}" r="${r}" stroke-width="13"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${o.cor||"var(--ink)"}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${(circ*frac).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c-2}" text-anchor="middle" style="fill:var(--ink);font:600 26px var(--mono);letter-spacing:-.03em">${Math.round(frac*100)}%</text>
    <text x="${c}" y="${c+17}" text-anchor="middle" style="fill:var(--ink-3);font:600 10px var(--mono);letter-spacing:.09em">${esc(o.sub||"")}</text>
  </svg>`;
}

/* barras espelhadas (assimetria) */
function gEspelho(o){
  const W=560,H=o.itens.length*46+24,mid=W/2,max=Math.max(...o.itens.flatMap(i=>[i.esq,i.dir]))*1.15;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt||"comparação lado a lado")}">
    ${o.itens.map((it,i)=>{
      const y=16+i*46, wE=(it.esq/max)*(mid-70), wD=(it.dir/max)*(mid-70);
      return `<text class="g-axis" x="${mid}" y="${y-2}" text-anchor="middle">${esc(it.t)}</text>
        <path class="g-bar" d="${barraTopo(mid-8-wE,y+6,wE,20,3)}" fill="var(--ramp-2)" tabindex="0" role="img"
          data-tip="${esc(it.t)} · esquerdo: ${kg(it.esq)}" aria-label="${esc(it.t)} esquerdo ${kg(it.esq)}"/>
        <path class="g-bar" d="${barraTopo(mid+8,y+6,wD,20,3)}" fill="var(--ramp-4)" tabindex="0" role="img"
          data-tip="${esc(it.t)} · direito: ${kg(it.dir)}" aria-label="${esc(it.t)} direito ${kg(it.dir)}"/>`;
    }).join("")}
  </svg>`;
}

const AGORA="09:20";
const TRAVAS=[
  {area:"vendas",cadeia:["Taxa de resposta da leva A+","Meta de conversas por semana","Barns em 4–6 pedidos"],href:"#/areas/vendas",dias:3},

];

/* Quanto precisa sobrar por mês pra fechar os R$ 5.000 em 31/03/2027, e
   quanto vai por mês pra dívida. Números do planejamento, não chute — vira
   dado editável assim que a lista de dívidas existir. */
const PRECISA=640, DIVIDA_MES=800;

function pHome(){
  const habitos=store.all("habitos"), tarefas=store.all("tarefas");
  const hoje="2026-08-16";
  const feitos=habitos.filter(h=>h.feito).length;
  const nivel=feitos===0?1:Math.min(5,1+Math.round((feitos/habitos.length)*4));
  const rot=["começando","andando","andando","bom dia","dia cheio"];
  const pedidos=store.all("pedidos")||[];
  const pedidosMes=pedidos.length?pedidos[pedidos.length-1].v:0;

  /* 2 — agenda: hábitos e tarefas do dia no mesmo eixo de horário */
  const agenda=[
    ...habitos.map(h=>({id:h.id,tipo:"habito",hora:h.hora,nome:h.nome,feito:h.feito,streak:h.streak,serve:h.serve})),
    ...tarefas.filter(t=>t.data===hoje&&t.hora).map(t=>({id:t.id,tipo:"tarefa",hora:t.hora,nome:t.titulo,feito:t.feita,area:t.area,foco:t.foco}))
  ].sort((a,b)=>a.hora.localeCompare(b.hora));
  let marcou=false;
  const linhas=agenda.map(i=>{
    let pre="";
    if(!marcou&&i.hora>AGORA){ marcou=true; pre=`<div class="agora"><i></i><b>agora ${AGORA}</b><s></s></div>`; }
    const meta=i.tipo==="habito"
      ? `<span class="tagm">${i.streak>0?i.streak+" dias":"recomeça"}</span><a class="serve" href="#/objetivos/${i.serve}">${esc(objDe(i.serve)?objDe(i.serve).titulo:i.serve)}</a>`
      : `<span class="area-tag"><i class="area-dot ${AREAS[i.area].cls}"></i>${AREAS[i.area].nome}</span>${i.foco?`<span class="badge badge-atencao">foco do dia</span>`:""}`;
    /* passou e já foi feito: apaga. Passou e não foi feito: fica aceso, é dívida do dia. */
    const apaga=i.hora<AGORA&&i.feito;
    return pre+`<li class="ag" data-passou="${apaga}">
      <span class="ag-h">${esc(i.hora)}</span>
      <input class="cb" type="checkbox" id="ag-${i.id}" data-${i.tipo==="habito"?"habito":"tarefa"}="${i.id}" ${i.feito?"checked":""} aria-label="Marcar ${esc(i.nome)}">
      <span class="ag-b"><label class="ag-n" for="ag-${i.id}">${esc(i.nome)}</label><span class="ag-m">${meta}</span></span>
      ${btnEdit(i.tipo==="habito"?"habito-editar":"tarefa-editar",i.id,"Editar")}
    </li>`;
  }).join("")+(marcou?"":`<div class="agora"><i></i><b>agora ${AGORA}</b><s></s></div>`);

  /* 4 — financeiro. "Livre" não é sobra: os gastos variáveis ainda não
     estão lançados, e dizer que sobrou seria mentir pra ele. */
  const entrou=soma(store.all("entradas"),e=>e.valor), saiu=soma(store.all("gastos"),g=>g.valor);
  const livre=entrou-saiu-DIVIDA_MES;

  /* 6 — trilhas: onde cada objetivo parou */
  const trilhas=objetivos().filter(o=>o.passos).map(o=>{
    const idx=o.passos.findIndex(p=>!p.feito);
    return {...o,idx,prox:idx>=0?o.passos[idx]:null,feitos:o.passos.filter(p=>p.feito).length};
  });

  $("#p-home").innerHTML=`
  <div class="stack">

    <!-- 1 · BRIEFING -->
    ${card(`Briefing de hoje`,
      `<span class="row"><span class="small dim num">06:12</span><a class="btn btn-outline btn-sm" href="#/briefing">Ver completo</a></span>`,
      `<div class="tri">
        <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Dólar</span>
          <span class="kpi-v" style="font-size:22px">5,12</span><span class="delta down">+0,9% na semana</span></div>
        <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Selic</span>
          <span class="kpi-v" style="font-size:22px">15,00<small>%</small></span><span class="small dim">corte só em novembro</span></div>
        <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Leva A+</span>
          <span class="kpi-v" style="font-size:22px">3<small> dias</small></span><span class="delta down">sem taxa apurada</span></div>
      </div>
      <div class="stack-tight" style="padding-top:var(--sp-2);border-top:1px solid var(--line)">
        <div class="linha"><span class="linha-n"><span>Câmbio encarece o lote da Vanetto em R$ 214</span><span class="small dim">travar antes de quarta economiza um mês de Claude Pro</span></span><a class="btn btn-ghost btn-sm" href="#/areas/loja">abrir</a></div>
        <div class="linha"><span class="linha-n"><span>A leva A+ está 3 dias sem taxa de resposta</span><span class="small dim">sem ela a meta de conversas é chute</span></span><a class="btn btn-ghost btn-sm" href="#/areas/vendas">abrir</a></div>
        <div class="linha"><span class="linha-n"><span>Semana nova do calendário começa amanhã</span><span class="small dim">academia 6:45, Barns 9:10</span></span><a class="btn btn-ghost btn-sm" href="#/rotina">abrir</a></div>
      </div>`,
      `<span class="small dim">Chega pronto todo dia às 6h. Você não escreve nada aqui.</span>
       <a class="btn btn-sm" href="#/briefing">Ler o briefing inteiro</a>`)}

    <!-- 2 · O DIA POR HORÁRIO -->
    ${card("O dia, por horário",
      `<span class="row">${btnAdd("tarefa-nova","Tarefa")}${btnAdd("habito-novo","Hábito")}</span>`,
      `<ul class="agenda">${linhas}</ul>`,
      `<span class="row" style="gap:var(--sp-3);flex:1">
         <span class="eyebrow">Nível do dia</span>
         <span class="num" style="font-weight:600">${nivel}/5</span>
         <span class="degraus" style="max-width:140px">${[1,2,3,4,5].map(i=>`<i class="degrau" data-on="${i<=nivel}"></i>`).join("")}</span>
       </span>
       <span class="badge badge-${nivel>=4?"bom":"neutro"}">${rot[nivel-1]}</span>`)}
    ${feitos===habitos.length?`<div class="fim">Os hábitos de hoje acabaram. Pode fechar o painel.</div>`:""}

    <!-- 3 · NOTÍCIAS -->
    <div class="stack-tight">
      <div class="between"><span class="eyebrow">Notícias que mexem com você</span><a class="btn btn-outline btn-sm" href="#/noticias">Ver todas</a></div>
      <div class="cols cols-3">${NOTICIAS.slice(0,3).map(n=>`
        <a class="card" href="#/noticias"><div class="card-c">
          <div class="capa" style="height:76px;background:linear-gradient(135deg,color-mix(in srgb,${n.c} 30%,var(--surface)),color-mix(in srgb,${n.c} 8%,var(--surface)))"><span>${esc(n.a)}</span></div>
          <h3>${esc(n.t)}</h3>
          <span class="small dim num">${esc(n.f)} · ${esc(n.h)}</span>
          <span class="small muted">${esc(n.p)}</span>
        </div></a>`).join("")}</div>
    </div>

    <!-- 4 · FINANCEIRO -->
    ${card("Resumo financeiro",
      `<a class="btn btn-outline btn-sm" href="#/financas">Abrir finanças</a>`,
      `<div class="tri">
        <div class="kpi"><span class="eyebrow">Entrou</span><span class="kpi-v" style="font-size:23px">${brl(entrou)}</span></div>
        <div class="kpi"><span class="eyebrow">Comprometido</span><span class="kpi-v" style="font-size:23px">${brl(DIVIDA_MES+saiu)}</span>
          <span class="small dim">dívida + fixos</span></div>
        <div class="kpi"><span class="eyebrow">Livre</span><span class="kpi-v" style="font-size:23px">${brl(livre)}</span>
          <span class="badge badge-${livre>=PRECISA?"bom":"atencao"}" style="align-self:flex-start">${livre>=PRECISA?"acima do preciso":"antes dos variáveis"}</span></div>
      </div>
      ${gBarras({labels:["entrou","dívida","fixos","livre"],h:190,fmtY:v=>(v/1000).toFixed(1).replace(".",",")+"k",fmtT:brl,
        series:[{nome:"reais",dados:[entrou,DIVIDA_MES,saiu,livre],cor:"var(--ramp-3)"}],
        meta:PRECISA,metaTxt:"precisa guardar "+brl(PRECISA),
        alt:"Para onde vai o dinheiro de agosto"})}
      <div class="vazio" style="padding:var(--sp-3) var(--sp-4)">
        <span class="small">Mercado, gasolina, comida fora e lazer ainda não estão lançados — então "livre" não é o que sobra de verdade. É por isso que existe o hábito de anotar o gasto do dia.</span>
      </div>`,
      `<span class="small dim">É o que sobra que constrói os R$ 5.000.</span>
       <a class="btn btn-outline btn-sm" href="#/financas/detalhe">Lançar gasto</a>`)}

    <!-- 5 · OBJETIVOS -->
    <div class="stack-tight">
      <div class="between"><span class="eyebrow">Objetivos</span><a class="btn btn-outline btn-sm" href="#/objetivos">Ver os 6</a></div>
      <div class="cols cols-3">${objetivos().map(cardObj).join("")}</div>
    </div>

    <!-- 6 · TRILHAS -->
    ${card("Trilhas — onde cada uma parou",
      `<span class="small dim num">${trilhas.length} em curso</span>`,
      trilhas.map(t=>`<a class="trilha" href="#/objetivos/${t.id}">
        <div class="between">
          <span class="area-tag"><i class="area-dot ${AREAS[t.area].cls}"></i>${esc(t.titulo)}</span>
          <span class="small dim num">${t.feitos}/${t.passos.length}</span>
        </div>
        <div class="pontos">${t.passos.map((p,i)=>`<i class="pt" data-f="${p.feito}" data-agora="${i===t.idx}" title="${esc(p.t)}"></i>`).join("")}
          <span class="small dim" style="margin-left:6px">${t.prox?"próximo passo":"trilha completa"}</span></div>
        ${t.prox?`<div class="between">
          <span class="linha-n"><span>${esc(t.prox.t)}</span><span class="small dim num">${esc(t.prox.q)}</span></span>
          <span class="badge badge-${/atrasado|parado|sem data/.test(t.prox.q)?"risco":"neutro"}">${/atrasado|parado/.test(t.prox.q)?"travado":/sem data/.test(t.prox.q)?"sem data":"em curso"}</span>
        </div>`:""}
      </a>`).join(""))}

    <!-- 7 · O GARGALO -->
    <div class="gargalo">
      <div class="between"><span class="eyebrow">O gargalo</span><span class="badge badge-risco">trava duas metas</span></div>
      <div class="fork">
        <a class="fonte" href="#/areas/vendas">
          <span class="fonte-l">Barns · pedidos este mês</span>
          <span class="fonte-v">${pedidosMes} <span style="font-size:.5em;opacity:.7">de 4–6</span></span>

        <div class="stem"></div>
        <div class="deps">
          <a class="dep dep-pessoal" href="#/objetivos/poupanca">
            <span class="area-tag"><i class="area-dot a-pessoal"></i>Pessoal</span>
            <strong style="font-weight:600">R$ 5.000 até março</strong>
            <span class="small dim num">${sobra>=PRECISA?"no ritmo":"faltam "+brl(PRECISA-sobra)+"/mês"}</span></a>
          <a class="dep dep-loja" href="#/objetivos/vanetto">
            <span class="area-tag"><i class="area-dot a-loja"></i>Vanetto</span>
            <strong style="font-weight:600">US$ 10.000 até dezembro</strong>
            <span class="small dim num">ads pagos pela comissão</span></a>
        </div>
      </div>
    </div>

    <!-- 8 · O QUE ESTÁ TRAVANDO -->
    ${card("O que está travando o quê",
      `<span class="badge badge-risco">4 correntes</span>`,
      TRAVAS.map(t=>`<a class="trava" href="${t.href}">
        <div class="between"><span class="area-tag"><i class="area-dot ${AREAS[t.area].cls}"></i>${AREAS[t.area].nome}</span>
          ${t.dias?`<span class="badge badge-risco">${t.dias}d parado</span>`:`<span class="badge badge-atencao">sem data</span>`}</div>
        <div class="ch">${t.cadeia.map((c,i)=>
          `<span class="ch-i ${i===0?"raiz":i===t.cadeia.length-1?"fim":""}">${esc(c)}</span>`
          +(i<t.cadeia.length-1?`<span class="ch-ar">→</span>`:"")).join("")}</div>
      </a>`).join(""))}

    <!-- 9 · CAPTURA E CONSTÂNCIA -->
    <div class="cols cols-3">
      ${card("Anotar sem sair daqui","",
        `<textarea class="input" id="capturaTxt" rows="3" placeholder="Ex.: a ótica de Uberaba pediu 12 armações"></textarea>
         <button class="btn btn-block" data-acao="captura">Salvar anotação</button>`)}
      ${card("Constância","",
        `${gRadial({v:41,max:61,sub:"DOS 61 DIAS",cor:"var(--ramp-4)"})}
         <span class="small dim" style="text-align:center">41 dias com pelo menos 1 hábito</span>`)}
      ${card("Próximo marco",`<span class="badge badge-neutro">4 de 8</span>`,
        `<h3>Dívida inteira mapeada</h3>
         <div class="prog" style="height:8px"><i style="width:40%"></i></div>

         <a class="btn btn-outline btn-sm" style="align-self:flex-start" href="#/conquistas">Ver conquistas</a>`)}
    </div>
  </div>`;
}

   DICA DE VALOR
   ============================================================ */
const tip=$("#tip");
function mostrarTip(el){
  const t=el.getAttribute("data-tip"); if(!t) return;
  tip.textContent=t; tip.setAttribute("data-on","true");
  const r=el.getBoundingClientRect(), rt=tip.getBoundingClientRect();
  tip.style.left=Math.min(Math.max(8,r.left+r.width/2-rt.width/2),innerWidth-rt.width-8)+"px";
  tip.style.top=Math.max(8,r.top-rt.height-10)+"px";
}
const esconderTip=()=>tip.removeAttribute("data-on");
document.addEventListener("pointerover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");el?mostrarTip(el):esconderTip()});
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)mostrarTip(el)});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");el?mostrarTip(el):esconderTip()});
document.addEventListener("focusout",esconderTip);
addEventListener("scroll",esconderTip,{passive:true});

/* ============================================================
   ROTEADOR
   ============================================================ */
const ROTAS={
  "/":["p-home",pHome],"/briefing":["p-briefing",pBriefing],"/noticias":["p-noticias",pNoticias],
  "/objetivos":["p-objetivos",pObjetivos],"/anotacoes":["p-anotacoes",pAnotacoes],"/tarefas":["p-tarefas",pTarefas],
  "/financas":["p-financas",pFinancas],"/financas/detalhe":["p-financas-detalhe",pFinancasDetalhe],
  "/treino":["p-treino",pTreino],"/estudo":["p-estudo",pEstudo],"/rotina":["p-rotina",pRotina],
  "/conquistas":["p-conquistas",pConquistas]
};

function rota(manterScroll){
  const h=location.hash.replace(/^#/,"")||"/";
  const p=h.split("/").filter(Boolean);
  let alvo;
  if(ROTAS[h]){ alvo=ROTAS[h][0]; ROTAS[h][1](); }
  else if(p[0]==="objetivos"&&p[1]){ pObjetivo(p[1]); alvo="p-objetivo"; }
  else if(p[0]==="areas"&&p[1]){ pArea(p[1]); alvo="p-area"; }
  else { pHome(); alvo="p-home"; }

  $$(".page").forEach(s=>s.hidden=s.id!==alvo);
  $$("[data-nav]").forEach(a=>{
    a.getAttribute("href").replace(/^#/,"")===h ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current");
  });
  esconderTip(); fecharNav();
  if(!manterScroll){ scrollTo({top:0,behavior:"instant"}); $("#conteudo").focus({preventScroll:true}); }
}
addEventListener("hashchange",()=>rota(false));
store.on(()=>rota(true));

/* ============================================================
   MENU E TEMA
   ============================================================ */
const nav=$("#nav"),scrim=$("#scrim"),navOpen=$("#navOpen");
function abrirNav(){nav.setAttribute("data-open","true");scrim.hidden=false;scrim.setAttribute("data-open","true");navOpen.setAttribute("aria-expanded","true")}
function fecharNav(){nav.removeAttribute("data-open");scrim.removeAttribute("data-open");scrim.hidden=true;navOpen.setAttribute("aria-expanded","false")}
navOpen.addEventListener("click",abrirNav);
$("#navClose").addEventListener("click",()=>{fecharNav();navOpen.focus()});
scrim.addEventListener("click",fecharNav);
addEventListener("keydown",e=>{if(e.key==="Escape")fecharNav()});
$("#temaBtn").addEventListener("click",()=>{
  const r=document.documentElement, a=r.getAttribute("data-theme");
  const escuro=a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme",escuro?"light":"dark");
});

/* ============================================================
   ONDE OS DADOS ESTÃO — o selo da barra de cima
   ============================================================ */
const ROTULO={
  salvo:    {t:"salvo",     d:"Gravado nos arquivos. O Claude enxerga daqui."},
  salvando: {t:"salvando",  d:"Gravando nos arquivos…"},
  local:    {t:"só aqui",   d:"Sem servidor: fica só neste navegador, não atravessa aparelho e o Claude não enxerga."}
};
store.aoMudarSituacao(s=>{
  const el=$("#sync"); if(!el) return;
  el.dataset.s=s;
  $("b",el).textContent=ROTULO[s].t;
  el.title=ROTULO[s].d;
});

rota(false);
store.iniciar();
</script>
